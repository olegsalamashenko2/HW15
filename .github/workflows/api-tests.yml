# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: API Tests and Allure Report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: API tests and Allure report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: untitled/pom.xml
    - name: Run API tests
      run: mvn --batch-mode --no-transfer-progress clean verify --file untitled/pom.xml
    - name: Generate Allure report (including failed tests)
      if: ${{ !cancelled() && hashFiles('untitled/target/allure-results/*-result.json') != '' }}
      run: mvn --batch-mode --no-transfer-progress allure:report --file untitled/pom.xml
    - name: Upload Allure HTML report
      if: ${{ !cancelled() && hashFiles('untitled/target/site/allure-maven-plugin/index.html') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: untitled/target/site/allure-maven-plugin/
        if-no-files-found: error
        retention-days: 14
